<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bay Cover Art</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
  <div>
    <h1>Neon Bay Cover Art</h1>
    <p>Your photos, a sunset grade, one bold poster. Export a PNG to share.</p>
  </div>
</header>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <fieldset>
      <legend>1 · Photos</legend>
      <label class="file">Add your photos <input id="photo" type="file" accept="image/*" multiple></label>
      <button id="samples" type="button">Use the sample photos</button>
      <div id="thumbs" class="thumbs"></div>
      <p class="hint">Click a panel on the cover, then a photo to place it there. Drag a panel to pan its photo; scroll over it to zoom.</p>
    </fieldset>
    <fieldset>
      <legend>2 · Panels</legend>
      <div class="row" id="layouts"></div>
      <label>Zoom <input id="zoom" type="range" min="1" max="3" step="0.05" value="1.15"></label>
      <button id="fill-all" type="button">Same photo in every panel</button>
    </fieldset>
    <fieldset>
      <legend>3 · Caption</legend>
      <label>Caption <input id="caption" type="text" maxlength="40" value="NEON BAY"></label>
      <label>Tagline <input id="tagline" type="text" maxlength="48" value="SUNSET HEIST"></label>
      <label>Caption size <input id="caption-size" type="range" min="0.6" max="1.4" step="0.05" value="1"></label>
      <label>Caption height <input id="caption-y" type="range" min="0.7" max="0.95" step="0.01" value="0.88"></label>
      <div class="row" id="caption-colors"></div>
    </fieldset>
    <fieldset>
      <legend>4 · Export</legend>
      <div class="row" id="sizes"></div>
      <button id="export" type="button" class="primary">Export PNG</button>
      <p id="status" role="status"></p>
    </fieldset>
  </section>
  <section class="preview">
    <canvas id="cover" width="1920" height="1080" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
